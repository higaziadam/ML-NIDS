name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-quality-gates:
    name: Tests and model-quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run test suite
        run: mkdir -p temp && python -m pytest -q --basetemp temp/pytest

      - name: Enforce undefined-name and unused-code checks
        run: python -m flake8 src scripts tests --select=F

      - name: Enforce V10 release-profile quality policy
        run: >-
          python -m src.quality_gates
          --profile models/configs/xgb_v10_candidate.json
          --output temp/quality-gates/v10_release_profile.json

      - name: Upload quality-gate report
        uses: actions/upload-artifact@v4
        with:
          name: v10-quality-gate-report
          path: temp/quality-gates/v10_release_profile.json
          if-no-files-found: error

  container-security:
    name: Container and dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python for dependency audit
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Audit Python dependencies
        run: >-
          python -m pip install --upgrade pip pip-audit &&
          pip-audit -r requirements.txt &&
          pip-audit -r requirements-runtime.txt

      - name: Lint batch Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          # DL3008 is deliberately ignored for the Debian security update in
          # the Dockerfile; the current patched package must be resolved at
          # build time rather than pinned indefinitely.
          ignore: DL3013,DL3008
          failure-threshold: error

      - name: Lint API Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.api
          ignore: DL3013,DL3008
          failure-threshold: error

      - name: Build batch-inference image
        run: docker build -t ml-nids:ci .

      - name: Build API image
        run: docker build -f Dockerfile.api -t ml-nids-api:ci .

      - name: Run Docker Compose API end-to-end test
        run: >-
          python -m pip install -r requirements-runtime.txt &&
          python -m scripts.docker_api_e2e

      - name: Scan batch image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # Trivy 0.70 can report stale package versions from bundled wheel
          # SBOM metadata. Use the current engine, which contains the related
          # SBOM-analysis fixes, while retaining the action's verified release.
          version: v0.74.0
          image-ref: ml-nids:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Scan API image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: ml-nids-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library

  dependency-review:
    name: Pull-request dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
