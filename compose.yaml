services:
  nids-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      MODEL_PATH: /app/models/saved/xgb_v10_regularized_fine_threshold.pkl
      API_KEY: ${API_KEY:-}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-1048576}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      DRIFT_STATUS_PATH: /app/runtime/observability/drift_report.json
    volumes:
      - ./models:/app/models:ro
      - ./runtime:/app/runtime:ro
    ports:
      - "8000:8000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.5
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      nids-api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.0.6
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-this-before-exposing}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  flow-watcher:
    build:
      context: .
      dockerfile: Dockerfile.api
    profiles: ["live"]
    command:
      - python
      - -m
      - src.live_monitor
      - --input-dir
      - /app/runtime/incoming_flows
      - --alerts-dir
      - /app/runtime/alerts
      - --processed-dir
      - /app/runtime/processed_flows
      - --failed-dir
      - /app/runtime/failed_flows
      - --api-url
      - http://nids-api:8000
    environment:
      ML_NIDS_API_KEY: ${API_KEY:-}
    volumes:
      - ./runtime:/app/runtime
    depends_on:
      nids-api:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
