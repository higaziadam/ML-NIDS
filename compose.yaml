services:
  nids-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      MODEL_PATH: /app/models/saved/xgb_v10_regularized_fine_threshold.pkl
      API_KEY: ${API_KEY:-}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-1048576}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    volumes:
      - ./models:/app/models:ro
    ports:
      - "8000:8000"
    restart: unless-stopped
