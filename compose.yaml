services:
  nids-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      MODEL_PATH: /app/models/saved/xgb_v10_regularized_fine_threshold.pkl
      API_KEY: ${API_KEY:-}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-1048576}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    volumes:
      - ./models:/app/models:ro
    ports:
      - "8000:8000"
    restart: unless-stopped

  flow-watcher:
    build:
      context: .
      dockerfile: Dockerfile.api
    profiles: ["live"]
    command:
      - python
      - -m
      - src.live_monitor
      - --input-dir
      - /app/runtime/incoming_flows
      - --alerts-dir
      - /app/runtime/alerts
      - --processed-dir
      - /app/runtime/processed_flows
      - --failed-dir
      - /app/runtime/failed_flows
      - --api-url
      - http://nids-api:8000
    environment:
      ML_NIDS_API_KEY: ${API_KEY:-}
    volumes:
      - ./runtime:/app/runtime
    depends_on:
      nids-api:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped
