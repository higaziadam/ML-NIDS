# Isolated Compose configuration used by scripts.docker_api_e2e and CI.
# It mounts a small synthetic artifact generated at test time, so no real model
# artifact or dataset is required for the container integration test.
services:
  nids-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      MODEL_PATH: /app/models/nids_api_smoke.pkl
      API_KEY: ""
      MAX_REQUEST_BYTES: "1048576"
      RATE_LIMIT_REQUESTS: "60"
      RATE_LIMIT_WINDOW_SECONDS: "60"
    volumes:
      - ./temp/docker-e2e/models:/app/models:ro
    ports:
      - "${ML_NIDS_E2E_PORT:-18000}:8000"
    restart: "no"
